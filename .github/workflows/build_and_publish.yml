name: Build & Publish Gufo OCI Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated images to build, or "all"'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  GUFO_REVISION: 24965a7493acb54508e5b110d862bd87d5a910ea

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.matrix.outputs.matrix_json }}
    steps:
      - id: matrix
        shell: bash
        run: |
          IN="${{ inputs.images || 'all' }}"
          if [[ "$IN" == "all" || -z "$IN" ]]; then
            echo 'matrix_json=["gufo-runtime","gufo-dev"]' >> "$GITHUB_OUTPUT"
          else
            IN_CLEAN=$(echo "$IN" | tr -d '[:space:]')
            echo "matrix_json=[\"${IN_CLEAN//,/\",\"}\"]" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix_json) }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI image with Nix
        run: |
          echo "🔨 Building ${{ matrix.target }}-image with Nix..."
          nix flake lock --override-input gufo-engine github:gufo-org/gufo/${{ env.GUFO_REVISION }}
          LOCKED_REVISION=$(jq -er '.nodes["gufo-engine"].locked.rev' flake.lock)
          test "$LOCKED_REVISION" = "${{ env.GUFO_REVISION }}"
          nix build .#packages.x86_64-linux.${{ matrix.target }}-image --out-link result-${{ matrix.target }}

      - name: Load and Push image to GHCR
        run: |
          set -euo pipefail
          IMAGE_NAME="${{ env.IMAGE_PREFIX }}/${{ matrix.target }}"
          SOURCE_IMAGE="ghcr.io/gufo-org/toolboxes/${{ matrix.target }}:edge"
          LOCKED_REVISION=$(jq -er '.nodes["gufo-engine"].locked.rev' flake.lock)
          test "$LOCKED_REVISION" = "${{ env.GUFO_REVISION }}"
          IMMUTABLE_TAG="sha-${LOCKED_REVISION}"

          echo "📥 Loading image into Docker daemon..."
          docker load < result-${{ matrix.target }}

          echo "🏷️ Tagging upstream image ${SOURCE_IMAGE} as ${IMAGE_NAME}:${IMMUTABLE_TAG}..."
          docker tag "$SOURCE_IMAGE" "${IMAGE_NAME}:${IMMUTABLE_TAG}"

          echo "🚀 Pushing immutable Gufo revision tag ${IMMUTABLE_TAG}..."
          docker push "${IMAGE_NAME}:${IMMUTABLE_TAG}"
